[project]
name = "article-wave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bytewax>=0.21.1",
    "comet-ml>=3.58.4",
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.83.0",
    "openai>=3.0.0",
    "opik>=2.0.21",
    "peft>=0.20.0",
    "pika>=1.4.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "qdrant-client>=1.19.0",
    "safetensors>=0.8.0",
    "sagemaker>=2.0.0,<3.0.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "transformers>=5.15.0",
    "unstructured>=0.25.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = []
