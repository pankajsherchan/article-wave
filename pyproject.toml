[project]
name = "article-wave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pika>=1.4.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "trafilatura>=2.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = []
